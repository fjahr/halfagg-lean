name: Model mutants

# The mutation test of the model builds the project once for every mutant. It
# changes the sources, so it has its own workflow.
on:
  push:
  pull_request:
  schedule:
    - cron: '47 3 * * 1'
  workflow_dispatch:

jobs:
  mutants:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # Installs the toolchain from lean-toolchain, fetches the Mathlib cache and
      # runs `lake build`.
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1.7.1
      # Fails if a mutant builds: the theorems would not depend on what it
      # changes.
      - name: Every mutant of the model breaks a theorem
        run: python3 scripts/mutate_model.py --in-place
