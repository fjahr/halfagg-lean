name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # BIP 458 at the commit the model was compared with: the test vectors and
      # the Python reference.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: bitcoin/bips
          ref: a7f91321f25b5be8d93e901775621c21519e80b7
          path: bips
          sparse-checkout: bip-0458
      - name: Source checks
        run: scripts/check.sh
      - name: The source checks fail when they should
        run: scripts/check_selftest.sh
      - name: Regenerate the test vector data
        run: python3 scripts/gen_vectors.py bips/bip-0458/vectors | diff - Halfagg/VectorData.lean
      # Installs the toolchain from lean-toolchain, fetches the Mathlib cache and
      # runs `lake build`. The build fails if the axioms of a main result, the
      # axioms of the project or the definitions behind the results change
      # (Halfagg/Summary.lean).
      - uses: leanprover/lean-action@ba3fdfe5c4476c925da13bf11a005ddb47e47aee # v1.7.1
      - name: Regenerate the summary
        run: python3 scripts/gen_summary.py | diff - Halfagg/Summary.lean
      # Also type-checks scripts/Fuzz.lean. Every run has a new seed, which the
      # script prints.
      - name: Differential test against the Python reference
        run: python3 scripts/fuzz.py bips/bip-0458 --cases 300 --seed "${{ github.run_id }}"
      - name: Replay the project, taproot-lean and agm-lean in the kernel
        run: scripts/replay.sh
      # Last, because it changes a source file: an axiom that no result uses
      # must fail the build through the inventory in Halfagg/Summary.lean.
      - name: The axiom inventory fails when it should
        run: |
          printf '\naxiom audit_backdoor : False\n' >> Halfagg/Tightness.lean
          if lake build Halfagg.Summary > inventory.log 2>&1; then
            echo "error: the build passes with a new axiom"; exit 1
          fi
          grep -q 'audit_backdoor' inventory.log
